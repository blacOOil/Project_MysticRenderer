<!doctype html><html><head><meta charset="utf-8"><title>Project Mystic</title><meta name="viewport" content="width=device-width,initial-scale=1"><script defer="defer" src="main.bundle.js"></script></head><body><div class="grid"><div class="item1"><h1>Project Mystic Renderer</h1></div><div class="item2"><canvas id="canvas-webgpu"></canvas><div class="drop-hint">Drop .obj file here</div></div><div class="item3"><input type="file" id="file-input" accept=".obj,.mtl,.fbx,.png,.jpg,.jpeg,.webp" style="display:none" multiple="multiple"> <button id="browse-btn">Browse .obj / .fbx</button> <button id="Previous_model">← Prev</button> <button id="Next_model">Next →</button> <label>Ambient <input type="range" id="ambient" min="0" max="1" step="0.01" value="0.2"></label> <label>Light X <input type="range" id="lightX" min="-5" max="5" step="0.1" value="1"></label> <label>Light Y <input type="range" id="lightY" min="-5" max="5" step="0.1" value="2"></label> <label>Light Z <input type="range" id="lightZ" min="-5" max="5" step="0.1" value="3"></label> <input type="color" id="bg-color" value="#1a1a26"></div></div></body></html>
