<!doctype html><html><head><meta charset="utf-8"><title>Project Mystic</title><meta name="viewport" content="width=device-width,initial-scale=1"><script defer="defer" src="main.bundle.js"></script></head><body><div class="grid"><div class="item1"><h1>Project Mystic Renderer</h1></div><div class="canvas-grid"><div class="viewport"><canvas id="canvas-0"></canvas><div class="drop-hint">Drop model here</div></div></div><div class="item3"><input type="file" id="file-input" accept=".obj,.mtl,.fbx,.png,.jpg,.jpeg,.webp" style="display:none" multiple="multiple"> <button id="browse-btn">Browse .obj / .fbx</button> <label>Ambient <input type="range" id="ambient" min="0" max="1" step="0.01" value="0.2"></label> <label>X <input type="range" id="lightX" min="-5" max="5" step="0.1" value="1"></label> <label>Y <input type="range" id="lightY" min="-5" max="5" step="0.1" value="2"></label> <label>Z <input type="range" id="lightZ" min="-5" max="5" step="0.1" value="3"></label> <label>Background-Color<input type="color" id="bg-color" value="#1a1a26"></label></div></div></body></html>
