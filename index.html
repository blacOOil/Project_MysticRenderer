<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Project Mystic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
   
</head>
<body>
    <div class="grid">
        <div class="item1">
            <h1>Project Mystic Renderer</h1>
        </div>
        <div class="item2">
            <canvas id="canvas-webgpu"></canvas>
            <div class="drop-hint">Drop .obj file here</div>
        </div>
        <div class="item3">
            <input type="file" id="file-input" accept=".obj,.fbx" style="display:none">
            <button id="browse-btn">Browse .obj / .fbx</button>
            <button id="Previous_model">← Prev</button>
            <button id="Next_model">Next →</button>
            
    </div>
</body>
</html>
