
<div id="topbar">Mystic Renderer</div>
 
<!-- Main -->
<div id="main">
 
  <!-- Viewport -->
  <div id="viewport-wrap">
    <canvas id="canvas-0"></canvas>
    <div class="drop-hint">Drop model here</div>
  </div>
 
  <!-- Right panel -->
  <div id="right-panel">
 
    <!-- Position -->
    <div class="panel-box">
      <div class="panel-title">Position</div>
      <div class="panel-body">
        <div class="pos-grid">
          <input type="number" id="posX1" value="0" step="0.1">
          <input type="number" id="posY1" value="0" step="0.1">
          <input type="number" id="posZ1" value="0" step="0.1">
          <input type="number" id="posX2" value="0" step="0.1">
          <input type="number" id="posY2" value="0" step="0.1">
          <input type="number" id="posZ2" value="0" step="0.1">
        </div>
      </div>
    </div>
 
    <!-- Light -->
    <div class="panel-box">
      <div class="panel-title">Light</div>
      <div class="panel-body">
        <div class="light-row">
          Ambient
          <input type="range" id="ambient" min="0" max="1" step="0.01" value="0.2">
        </div>
        <div class="light-row">
          X
          <input type="range" id="lightX" min="-5" max="5" step="0.1" value="1">
        </div>
        <div class="light-row">
          Y
          <input type="range" id="lightY" min="-5" max="5" step="0.1" value="2">
        </div>
        <div class="light-row">
          Z
          <input type="range" id="lightZ" min="-5" max="5" step="0.1" value="3">
        </div>
      </div>
    </div>
 
    <!-- Polygon -->
    <div class="panel-box">
      <div class="panel-title">Polygon</div>
      <div class="panel-body">
        <table class="poly-table">
          <tr><td>verts:</td> <td id="p-verts">0</td> <td>0</td></tr>
          <tr><td>Edges:</td> <td id="p-edges">0</td> <td>0</td></tr>
          <tr><td>Faces:</td> <td id="p-faces">0</td> <td>0</td></tr>
          <tr><td>Tris:</td>  <td id="p-tris">0</td>  <td>0</td></tr>
          <tr><td>UVs:</td>   <td id="p-uvs">0</td>   <td>0</td></tr>
        </table>
      </div>
    </div>
 
  </div><!-- /right-panel -->
</div><!-- /main -->
 
<!-- Bottom bar -->
<div id="bottombar">
  <input type="file" id="file-input" accept=".obj,.mtl,.fbx,.png,.jpg,.jpeg,.webp" multiple>
  <button id="browse-btn">Brown Model</button>
  <input type="color" id="bg-color" value="#262626" title="Background color">
</div>
